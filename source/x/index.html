<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>晴天</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%}
        body{
            display:grid;place-items:center;
            padding:24px;
            background:#0f0f0f;
            color:#eaeaea;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
            -webkit-font-smoothing:antialiased;
        }

        .card{
            width:100%;max-width:340px;
            padding:40px 36px 36px;
            background:#141414;
            border:1px solid #222;
            border-radius:10px;
        }

        h1{
            font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
            font-size:clamp(32px,8vw,40px);
            font-weight:500;
            letter-spacing:6px;
            line-height:1;
            color:#f2f2f2;
            padding-left:4px; /* 平衡 letter-spacing 造成的视觉右偏 */
        }

        .rule{
            width:32px;height:1px;
            background:#2e2e2e;
            margin:24px 0 30px;
        }

        .times{
            display:flex;justify-content:space-between;
            font-size:11px;
            font-variant-numeric:tabular-nums;
            letter-spacing:.5px;
            color:#5a5a5a;
            margin-bottom:10px;
        }

        .track{
            height:1px;
            background:#262626;
            margin-bottom:32px;
            overflow:hidden;
        }
        .track i{
            display:block;
            height:100%;
            width:0%;
            background:#e0e0e0;
        }

        .btn{
            display:flex;align-items:center;justify-content:center;
            gap:10px;
            width:100%;height:50px;
            background:transparent;
            border:1px solid #2b2b2b;
            border-radius:6px;
            color:#eaeaea;
            font-family:inherit;
            font-size:13px;font-weight:500;
            letter-spacing:4px;
            padding-left:4px;
            cursor:pointer;
            transition:border-color .2s,background .2s,color .2s;
        }
        .btn:hover:not(:disabled){
            border-color:#444;
            background:#181818;
        }
        .btn:active:not(:disabled){
            background:#1c1c1c;
        }
        .btn:disabled{
            cursor:default;
            color:#666;
            border-color:#242424;
        }

        .btn svg{
            width:10px;height:10px;
            flex-shrink:0;
            margin-left:-2px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>晴天</h1>
    <div class="rule"></div>

    <div class="times">
        <span id="cur">0:00</span>
        <span id="dur">0:47</span>
    </div>
    <div class="track"><i id="fill"></i></div>

    <button class="btn" id="btn">
        <svg viewBox="0 0 10 10" fill="currentColor" aria-hidden="true">
            <path d="M2 1v8l7-4z"/>
        </svg>
        <span id="lbl">播放</span>
    </button>
</div>

<script>
    !function(){
        const btn  = document.getElementById('btn');
        const lbl  = document.getElementById('lbl');
        const cur  = document.getElementById('cur');
        const dur  = document.getElementById('dur');
        const fill = document.getElementById('fill');

        const S=[[64,1],[62,1],[65,1],[64,1],[60,1],[67,1],[71,1],[60,1],[71,1],[67,1],[60,1],[60,1],[69,1],[69,1],[69,1],[67,1],[67,1],[67,1],[65,1],[64,1],[62,1],[64,1],[65,1],[64,1],[76,1],[77,1],[67,1],[64,1],[67,1],[71,1],[62,1],[71,1],[60,1],[60,1.5],[60,1],[60,1],[67,1],[67,1],[69,1],[67,1],[65,1],[62,1],[64,1],[65,1],[67,1],[69,1],[60,1.5],[69,1],[71,1],[71,1],[64,1],[62,1],[65,1],[64,1],[60,1],[67,1],[71,1],[60,1],[71,1],[67,1],[60,1],[60,1],[69,1],[69,1],[69,1],[67,1],[67,1],[67,1],[65,1],[64,1],[62,1],[64,1],[65,1],[64,1.5],[76,1],[77,1],[67,1],[64,1],[64,1],[67,1],[71,1],[62,1],[71,1],[60,1],[60,1.5],[60,1],[60,1],[60,1],[67,1],[67,1],[69,1],[67,1],[65,1],[69,1],[71,1],[60,1],[62,1],[64,1],[62,1],[0,1],[0,1],[67,1],[64,1],[60,1.5]];

        const BEAT  = 60/140;
        const TOTAL = S.reduce((a,[,d]) => a+d, 0) * BEAT;

        function fmt(s){
            const m = Math.floor(s/60);
            const ss = Math.floor(s%60).toString().padStart(2,'0');
            return m + ':' + ss;
        }
        dur.textContent = fmt(TOTAL);

        // —— 音频 ——
        let ac, master, dry, wet, wave;
        let playing = false, rafId = 0, t0 = 0;

        function buildGraph(){
            if(ac) return;
            ac = new (window.AudioContext || window.webkitAudioContext)();

            master = ac.createGain();
            master.gain.value = 0.3;

            const comp = ac.createDynamicsCompressor();
            comp.threshold.value = -16;
            comp.knee.value      = 12;
            comp.ratio.value     = 4;
            comp.attack.value    = 0.004;
            comp.release.value   = 0.25;

            const len = Math.floor(ac.sampleRate * 2.0);
            const ir  = ac.createBuffer(2, len, ac.sampleRate);
            for(let ch = 0; ch < 2; ch++){
                const d = ir.getChannelData(ch);
                for(let i = 0; i < len; i++)
                    d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3);
            }
            const reverb = ac.createConvolver();
            reverb.buffer = ir;
            wet = ac.createGain(); wet.gain.value = 0.2;
            dry = ac.createGain(); dry.gain.value = 0.85;

            reverb.connect(wet).connect(master);
            dry.connect(master);
            master.connect(comp).connect(ac.destination);
        }

        function getWave(){
            if(wave) return wave;
            const N = 9;
            const real = new Float32Array(N), imag = new Float32Array(N);
            const h = [0,1,0.55,0.32,0.2,0.12,0.08,0.05,0.03];
            for(let i = 1; i < N; i++) imag[i] = h[i];
            wave = ac.createPeriodicWave(real, imag);
            return wave;
        }

        function piano(t, m, d){
            if(m === 0) return;
            const f = 440 * Math.pow(2, (m-69)/12);

            const out = ac.createGain();
            const pan = ac.createStereoPanner();
            pan.pan.value = Math.max(-0.4, Math.min(0.4, (m-68)/24));

            const o1 = ac.createOscillator();
            o1.setPeriodicWave(getWave());
            o1.frequency.value = f;

            const o2 = ac.createOscillator();
            o2.type = 'sine';
            o2.frequency.value = f * 2.003;
            const g2 = ac.createGain();
            g2.gain.value = 0.1;

            o1.connect(out);
            o2.connect(g2).connect(out);
            out.connect(pan);
            pan.connect(dry);
            pan.connect(wet);

            const decay      = Math.max(0.5, Math.min(3.0, 1.6 * Math.pow(2, (69-m)/24)));
            const holdEnd    = t + Math.max(d, 0.08);
            const releaseEnd = holdEnd + decay;

            const g = out.gain;
            g.setValueAtTime(0, t);
            g.linearRampToValueAtTime(0.85, t + 0.006);
            g.exponentialRampToValueAtTime(0.08, holdEnd);
            g.exponentialRampToValueAtTime(0.0001, releaseEnd);

            o1.start(t); o2.start(t);
            o1.stop(releaseEnd + 0.05);
            o2.stop(releaseEnd + 0.05);

            o1.onended = () => {
                try { pan.disconnect(); out.disconnect(); g2.disconnect(); } catch(e){}
            };
        }

        // —— 进度 ——
        function frame(){
            const p = Math.max(0, Math.min(1, (ac.currentTime - t0) / TOTAL));
            fill.style.width = (p*100) + '%';
            cur.textContent  = fmt(p * TOTAL);
            if(playing) rafId = requestAnimationFrame(frame);
        }

        function reset(){
            playing = false;
            cancelAnimationFrame(rafId);
            btn.disabled = false;
            lbl.textContent = '播放';
            cur.textContent = '0:00';
            fill.style.width = '0%';
        }

        btn.onclick = async () => {
            if(playing) return;
            playing = true;
            btn.disabled = true;
            lbl.textContent = '演奏中';

            buildGraph();
            if(ac.state === 'suspended') await ac.resume();

            t0 = ac.currentTime + 0.08;
            let c = t0;
            for(const [m,d] of S){
                piano(c, m, BEAT*d);
                c += BEAT*d;
            }

            cancelAnimationFrame(rafId);
            frame();
            setTimeout(reset, (c - ac.currentTime)*1000 + 600);
        };
    }();
</script>
</body>
</html>
