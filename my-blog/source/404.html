<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>404</title>
    <style>
        :root{
            --bg:#f2f1ec;
            --ink:#16171b;
            --dim:#8f8d84;
            --sym:#dedbd1;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        html{-webkit-text-size-adjust:100%;}
        body{
            min-height:100vh;
            background:var(--bg);
            color:var(--ink);
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
            display:flex;
            overflow-x:hidden;
            -webkit-font-smoothing:antialiased;
            text-rendering:optimizeLegibility;
        }
        ::selection{background:var(--ink);color:var(--bg);}

        .field{
            position:fixed;
            inset:0;
            overflow:hidden;
            pointer-events:none;
            z-index:0;
            contain:strict;
        }
        .track{
            position:absolute;
            left:0;
            top:var(--y);
            display:flex;
            white-space:nowrap;
            animation:slide var(--d) linear infinite;
            animation-delay:var(--t);
            will-change:transform;
        }
        .track.rev{animation-direction:reverse;}
        .set{display:flex;align-items:baseline;}
        .set span{
            font-size:clamp(2.2rem,6.4vw,5rem);
            font-weight:700;
            line-height:1;
            color:var(--sym);
            margin-right:clamp(2.5rem,9vw,9rem);
            user-select:none;
        }
        @keyframes slide{
            from{transform:translateX(0);}
            to{transform:translateX(-50%);}
        }

        main{
            position:relative;
            z-index:1;
            width:100%;
            max-width:68rem;
            margin:auto;
            padding:clamp(2rem,7vh,4rem) clamp(1.4rem,7vw,5rem);
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }

        .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            font-size:10px;
            letter-spacing:.24em;
            color:var(--dim);
            text-transform:uppercase;
        }
        .top .live{display:flex;align-items:center;gap:.6rem;}
        .top .dot{
            width:5px;height:5px;border-radius:50%;
            background:var(--ink);
            animation:pulse 3s ease-in-out infinite;
        }
        @keyframes pulse{
            0%,100%{opacity:1;}
            50%{opacity:.15;}
        }

        h1{
            margin:auto 0;
            font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
            font-weight:700;
            font-size:clamp(2.6rem,9vw,6.2rem);
            line-height:1.16;
            letter-spacing:-.02em;
            display:flex;
            flex-direction:column;
        }
        h1 span{display:block;}

        .en{
            margin-top:clamp(1.6rem,4vw,2.4rem);
            font-size:clamp(9px,1.4vw,11px);
            letter-spacing:.34em;
            color:var(--dim);
            text-transform:uppercase;
        }

        .bottom{
            display:flex;
            justify-content:space-between;
            align-items:flex-end;
            margin-top:clamp(3rem,8vh,5rem);
        }
        .code{
            font-size:clamp(13px,1.8vw,15px);
            letter-spacing:.16em;
        }
        .year{
            font-size:10px;
            letter-spacing:.2em;
            color:var(--dim);
        }

        @media (max-width:680px){
            .track:nth-child(even){display:none;}
            .set span{
                font-size:clamp(1.5rem,8vw,2.2rem);
                margin-right:clamp(1.8rem,10vw,4rem);
            }
            .top{font-size:9px;letter-spacing:.18em;}
        }
        @media (prefers-reduced-motion:reduce){
            .track,.top .dot{animation:none;}
        }
    </style>
</head>
<body>

<div class="field" aria-hidden="true">
    <div class="track" style="--y:10%;--d:150s;--t:-20s">
        <div class="set"><span>404</span><span>0x194</span><span>? ? ?</span><span>null</span><span>[ ]</span></div>
        <div class="set"><span>404</span><span>0x194</span><span>? ? ?</span><span>null</span><span>[ ]</span></div>
    </div>
    <div class="track rev" style="--y:28%;--d:180s;--t:-60s">
        <div class="set"><span>NOT FOUND</span><span>∞</span><span>0b0</span><span>&lt;/&gt;</span><span>void</span></div>
        <div class="set"><span>NOT FOUND</span><span>∞</span><span>0b0</span><span>&lt;/&gt;</span><span>void</span></div>
    </div>
    <div class="track" style="--y:47%;--d:140s;--t:-90s">
        <div class="set"><span>-0</span><span>{ }</span><span>::</span><span>undefined</span><span>??</span></div>
        <div class="set"><span>-0</span><span>{ }</span><span>::</span><span>undefined</span><span>??</span></div>
    </div>
    <div class="track rev" style="--y:66%;--d:200s;--t:-30s">
        <div class="set"><span>0o404</span><span>NaN</span><span>&lt;br&gt;</span><span>=&gt;</span><span>!</span></div>
        <div class="set"><span>0o404</span><span>NaN</span><span>&lt;br&gt;</span><span>=&gt;</span><span>!</span></div>
    </div>
    <div class="track" style="--y:85%;--d:165s;--t:-110s">
        <div class="set"><span>0x00</span><span>|&gt;</span><span>NaN</span><span>404</span><span>*/</span></div>
        <div class="set"><span>0x00</span><span>|&gt;</span><span>NaN</span><span>404</span><span>*/</span></div>
    </div>
</div>

<main>
    <div class="top">
        <span class="live"><span class="dot"></span>STATUS</span>
        <span>404</span>
    </div>

    <h1>
        <span>这条路径</span>
        <span>无法抵达</span>
        <span>任何页面</span>
    </h1>
    <p class="en">The page you seek is not here</p>

    <div class="bottom">
        <span class="code">// 页面不存在</span>
        <span class="year">ERROR</span>
    </div>
</main>

</body>
</html>
