<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sky</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .scene {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 4/3;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }

        .sky {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 65%;
            background: linear-gradient(
                    to bottom,
                    rgb(4, 25, 98) 0%,
                    rgb(5, 29, 110) 10%,
                    rgb(6, 34, 120) 15%,
                    rgb(10, 42, 134) 22%,
                    rgb(14, 51, 149) 30%,
                    rgb(20, 62, 165) 38%,
                    rgb(27, 78, 183) 45%,
                    rgb(33, 95, 198) 52%,
                    rgb(39, 115, 215) 58%,
                    rgb(43, 130, 226) 63%,
                    rgb(43, 131, 220) 65%
            );
        }

        .ground {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 35%;
            background: linear-gradient(
                    to bottom,
                    rgb(8, 18, 49) 0%,
                    rgb(7, 13, 36) 8%,
                    rgb(8, 14, 36) 15%,
                    rgb(12, 12, 24) 30%,
                    rgb(15, 14, 21) 55%,
                    rgb(18, 16, 21) 80%,
                    rgb(25, 20, 21) 100%
            );
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            box-shadow: 0 0 4px 1px rgba(255, 255, 255, 0.3);
            top: 47%;
            left: 41.5%;
        }

        .star::after {
            content: '';
            position: absolute;
            width: 1px;
            height: 1px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            top: 8px;
            left: 12px;
        }
    </style>
</head>
<body>
<div class="scene">
    <div class="sky"></div>
    <div class="ground"></div>
    <div class="star"></div>
</div>
</body>
</html>
