<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>音频播放器</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
            Helvetica Neue, Arial, sans-serif;
            background: #f3f4f0;
            color: #223028;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .page {
            width: min(92vw, 560px);
        }

        .player {
            background: #ffffff;
            border: 1px solid #e4e7e0;
            border-radius: 30px;
            box-shadow: 0 24px 60px rgba(23, 42, 33, 0.08);
            padding: 34px 34px 22px;
        }

        .eyebrow {
            margin: 0;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #7c897f;
        }

        .title {
            margin: 12px 0 6px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 34px;
            font-weight: 500;
            line-height: 1.08;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 0;
            color: #75817a;
            font-size: 14px;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 30px 0 10px;
            font-size: 13px;
            color: #626d66;
            font-variant-numeric: tabular-nums;
        }

        .seek {
            padding: 10px 0;
            cursor: pointer;
            touch-action: none;
            outline: none;
        }

        .seek-rail {
            position: relative;
            height: 4px;
            border-radius: 999px;
            background: #e7ebe4;
            overflow: visible;
        }

        .seek-fill {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: #11614f;
            transform-origin: left center;
            transform: scaleX(var(--p, 0));
            will-change: transform;
        }

        .seek-thumb {
            position: absolute;
            top: 50%;
            left: calc(var(--p, 0) * 100%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid #cfd8d0;
            box-shadow: 0 2px 8px rgba(20, 40, 30, 0.16);
            transform: translate(-50%, -50%);
            transition: transform 0.18s ease;
            will-change: left, transform;
        }

        .seek.dragging .seek-thumb {
            transform: translate(-50%, -50%) scale(1.18);
        }

        .seek:focus-visible .seek-rail {
            outline: 2px solid rgba(17, 97, 79, 0.25);
            outline-offset: 6px;
            border-radius: 999px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin: 22px 0 18px;
        }

        button {
            appearance: none;
            border: 1px solid #dfe4dd;
            background: #ffffff;
            color: #26332c;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer;
            padding: 0;
            transition: transform 0.18s ease, background 0.18s ease,
            border-color 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
            background: #fbfcfa;
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        button:focus-visible,
        .track:focus-visible {
            outline: 2px solid rgba(17, 97, 79, 0.35);
            outline-offset: 3px;
        }

        .play {
            width: 68px;
            height: 68px;
            background: #11614f;
            border-color: #11614f;
            color: #ffffff;
        }

        .play:hover {
            background: #0d5847;
        }

        .playlist {
            border-top: 1px solid #e9ede6;
            padding-top: 10px;
            margin-top: 4px;
        }

        .track {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            border: 0;
            background: transparent;
            padding: 12px 10px;
            border-radius: 16px;
            text-align: left;
        }

        .track:hover {
            background: #f6f8f4;
            transform: none;
        }

        .track.active {
            background: #eef4ef;
        }

        .track .no {
            width: 34px;
            height: 34px;
            border: 1px solid #dfe4dd;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 12px;
            color: #5d6a62;
            background: #ffffff;
            flex: 0 0 auto;
        }

        .track.active .no {
            background: #11614f;
            border-color: #11614f;
            color: #ffffff;
        }

        .track .name {
            flex: 1;
            min-width: 0;
        }

        .track .name strong {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #26332c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track .name span {
            display: block;
            margin-top: 2px;
            font-size: 12px;
            color: #75817a;
        }

        .track .time {
            flex: 0 0 auto;
            font-size: 12px;
            color: #75817a;
            font-variant-numeric: tabular-nums;
        }

        .hint {
            min-height: 18px;
            margin: 12px 4px 0;
            color: #849087;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 520px) {
            .player {
                padding: 26px 20px 18px;
            }

            .title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <section class="player" aria-label="本地音频播放器">
        <header>
            <p class="eyebrow">Local Audio</p>
            <h1 class="title" id="trackTitle">正在检索音频</h1>
            <p class="subtitle" id="trackSub">同目录 1.mp3 至 3.mp3</p>
        </header>

        <div class="time-row">
            <span id="currentTime">00:00</span>
            <span id="duration">00:00</span>
        </div>

        <div
                id="seek"
                class="seek"
                role="slider"
                tabindex="0"
                aria-label="播放进度"
                aria-valuemin="0"
                aria-valuemax="0"
                aria-valuenow="0"
                aria-valuetext="00:00 / 00:00"
        >
            <div class="seek-rail">
                <div class="seek-fill"></div>
                <div class="seek-thumb"></div>
            </div>
        </div>

        <div class="controls">
            <button id="prevBtn" type="button" aria-label="上一首">
                <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 6h2v12H7zM20 6v12l-9-6z" fill="currentColor" />
                </svg>
            </button>

            <button id="playBtn" type="button" class="play" aria-label="播放">
                <svg id="iconPlay" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 5v14l11-7z" fill="currentColor" />
                </svg>
                <svg
                        id="iconPause"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                        style="display: none"
                >
                    <path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" />
                </svg>
            </button>

            <button id="nextBtn" type="button" aria-label="下一首">
                <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 6h2v12h-2zM4 6v12l9-6z" fill="currentColor" />
                </svg>
            </button>
        </div>

        <section id="playlist" class="playlist" aria-label="播放列表"></section>

        <p id="hint" class="hint"></p>
    </section>
</main>

<audio id="audio" preload="metadata"></audio>

<script>
    (() => {
        const FILES = ["1.mp3", "2.mp3", "3.mp3"];
        const STORAGE_KEY = "elegant-local-player-v1";

        const audio = document.getElementById("audio");
        const titleEl = document.getElementById("trackTitle");
        const subEl = document.getElementById("trackSub");
        const currentTimeEl = document.getElementById("currentTime");
        const durationEl = document.getElementById("duration");
        const seekEl = document.getElementById("seek");
        const playlistEl = document.getElementById("playlist");
        const hintEl = document.getElementById("hint");
        const playBtn = document.getElementById("playBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const iconPlay = document.getElementById("iconPlay");
        const iconPause = document.getElementById("iconPause");

        const state = {
            tracks: [],
            index: -1,
            seeking: false,
            wasPlaying: false,
            pendingTime: null,
            autoplayAfterLoad: false,
            raf: 0,
            loadToken: 0,
        };

        let positions = {};

        try {
            positions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        } catch {
            positions = {};
        }

        const clamp = (value, min, max) =>
            Math.min(max, Math.max(min, value));

        const formatTime = (value) => {
            if (!Number.isFinite(value) || value < 0) value = 0;
            const minutes = Math.floor(value / 60);
            const seconds = Math.floor(value % 60);
            return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        };

        const trackTitle = (src) => {
            const name = src.replace(/\.mp3$/i, "");
            return `曲目 ${name.padStart(2, "0")}`;
        };

        const savePosition = () => {
            const track = state.tracks[state.index];
            if (!track) return;

            positions[track.src] = audio.currentTime;

            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
            } catch {
                /* 忽略存储失败 */
            }
        };

        const updatePlayIcon = (playing) => {
            playBtn.setAttribute("aria-label", playing ? "暂停" : "播放");
            iconPlay.style.display = playing ? "none" : "block";
            iconPause.style.display = playing ? "block" : "none";
        };

        const updateUI = () => {
            const duration = Number.isFinite(audio.duration)
                ? audio.duration
                : state.tracks[state.index]?.duration || 0;

            const time =
                state.seeking && state.pendingTime != null
                    ? state.pendingTime
                    : audio.currentTime;

            const progress = duration > 0 ? clamp(time / duration, 0, 1) : 0;

            currentTimeEl.textContent = formatTime(time);
            durationEl.textContent = formatTime(duration);

            seekEl.style.setProperty("--p", progress);
            seekEl.setAttribute("aria-valuenow", time.toFixed(1));
            seekEl.setAttribute("aria-valuemax", duration.toFixed(1));
            seekEl.setAttribute(
                "aria-valuetext",
                `${formatTime(time)} / ${formatTime(duration)}`
            );
        };

        const startTicker = () => {
            cancelAnimationFrame(state.raf);

            const tick = () => {
                if (!audio.paused) {
                    if (!state.seeking) updateUI();
                    state.raf = requestAnimationFrame(tick);
                }
            };

            state.raf = requestAnimationFrame(tick);
        };

        const play = () => {
            if (state.index < 0) return;

            const promise = audio.play();

            if (promise) {
                promise.catch(() => {
                    updatePlayIcon(false);
                    hintEl.textContent = "浏览器限制了自动播放，请点击播放按钮";
                });
            }
        };

        const pause = () => {
            audio.pause();
        };

        const togglePlay = () => {
            if (audio.paused) {
                play();
            } else {
                pause();
            }
        };

        const refreshPlaylist = () => {
            Array.from(playlistEl.children).forEach((button, index) => {
                const active = index === state.index;
                button.classList.toggle("active", active);

                if (active) {
                    button.setAttribute("aria-current", "true");
                } else {
                    button.removeAttribute("aria-current");
                }

                const timeEl = button.querySelector(".time");
                const track = state.tracks[index];

                if (timeEl && track) {
                    timeEl.textContent = formatTime(track.duration);
                }
            });
        };

        const renderPlaylist = () => {
            playlistEl.textContent = "";

            state.tracks.forEach((track, index) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "track";

                const number = document.createElement("span");
                number.className = "no";
                number.textContent = String(index + 1).padStart(2, "0");

                const name = document.createElement("span");
                name.className = "name";

                const strong = document.createElement("strong");
                strong.textContent = trackTitle(track.src);

                const file = document.createElement("span");
                file.textContent = track.src;

                name.append(strong, file);

                const time = document.createElement("span");
                time.className = "time";
                time.textContent = formatTime(track.duration);

                button.append(number, name, time);

                button.addEventListener("click", () => {
                    if (index === state.index) {
                        togglePlay();
                    } else {
                        loadTrack(index, true);
                    }
                });

                playlistEl.appendChild(button);
            });
        };

        const loadTrack = (index, autoplay = false) => {
            const track = state.tracks[index];
            if (!track) return;

            state.index = index;
            state.autoplayAfterLoad = autoplay;
            state.pendingTime = null;

            const token = ++state.loadToken;

            titleEl.textContent = trackTitle(track.src);
            subEl.textContent = `本地文件 · ${track.src}`;
            durationEl.textContent = formatTime(track.duration);
            hintEl.textContent = "";

            refreshPlaylist();

            audio.src = track.src;
            audio.load();

            audio.onloadedmetadata = () => {
                if (token !== state.loadToken) return;

                const duration = Number.isFinite(audio.duration)
                    ? audio.duration
                    : track.duration;

                track.duration = duration;
                state.tracks[index] = track;

                const saved = positions[track.src] || 0;
                const canResume = saved > 0 && saved < duration - 0.8;

                audio.currentTime = canResume ? saved : 0;

                durationEl.textContent = formatTime(duration);
                refreshPlaylist();
                updateUI();

                if (state.autoplayAfterLoad) {
                    state.autoplayAfterLoad = false;
                    play();
                }
            };

            audio.onerror = () => {
                if (token !== state.loadToken) return;
                hintEl.textContent = "音频加载失败，请检查文件是否存在";
                updatePlayIcon(false);
            };

            updateUI();
        };

        const step = (delta) => {
            if (!state.tracks.length) return;

            const nextIndex =
                (state.index + delta + state.tracks.length) % state.tracks.length;

            loadTrack(nextIndex, true);
        };

        const probeFile = (src) => {
            return new Promise((resolve) => {
                const tester = document.createElement("audio");
                tester.preload = "metadata";

                let settled = false;

                const finish = (ok, duration) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    tester.removeAttribute("src");

                    try {
                        tester.load();
                    } catch {
                        /* 忽略 */
                    }

                    resolve({
                        src,
                        ok,
                        duration: Number.isFinite(duration) ? duration : 0,
                    });
                };

                const timer = setTimeout(() => finish(false, 0), 5000);

                tester.addEventListener(
                    "loadedmetadata",
                    () => finish(true, tester.duration),
                    { once: true }
                );

                tester.addEventListener("error", () => finish(false, 0), {
                    once: true,
                });

                tester.src = src;
                tester.load();
            });
        };

        const init = async () => {
            hintEl.textContent = "正在检索同目录音频文件";

            const results = await Promise.all(FILES.map(probeFile));

            state.tracks = results
                .filter((item) => item.ok)
                .map((item) => ({
                    src: item.src,
                    duration: item.duration,
                }));

            if (!state.tracks.length) {
                titleEl.textContent = "未找到音频文件";
                subEl.textContent = "请将 1.mp3、2.mp3、3.mp3 放在页面同目录";
                hintEl.textContent =
                    "浏览器不能直接扫描目录，因此按约定文件名检索";
                renderPlaylist();
                return;
            }

            renderPlaylist();

            const randomIndex = Math.floor(Math.random() * state.tracks.length);
            loadTrack(randomIndex, true);
        };

        const getSeekRatio = (event) => {
            const rect = seekEl.getBoundingClientRect();
            return clamp((event.clientX - rect.left) / rect.width, 0, 1);
        };

        seekEl.addEventListener("pointerdown", (event) => {
            const duration = audio.duration;

            if (!Number.isFinite(duration) || duration <= 0) return;

            seekEl.setPointerCapture(event.pointerId);

            state.seeking = true;
            state.wasPlaying = !audio.paused;

            if (state.wasPlaying) {
                audio.pause();
            }

            seekEl.classList.add("dragging");

            state.pendingTime = getSeekRatio(event) * duration;
            updateUI();

            event.preventDefault();
        });

        seekEl.addEventListener("pointermove", (event) => {
            if (!state.seeking) return;

            const duration = audio.duration;
            if (!Number.isFinite(duration) || duration <= 0) return;

            state.pendingTime = getSeekRatio(event) * duration;
            updateUI();
        });

        const endSeek = () => {
            if (!state.seeking) return;

            state.seeking = false;
            seekEl.classList.remove("dragging");

            const duration = audio.duration;

            if (Number.isFinite(duration) && state.pendingTime != null) {
                audio.currentTime = clamp(state.pendingTime, 0, duration);
                savePosition();
                updateUI();
            }

            state.pendingTime = null;

            if (state.wasPlaying) {
                play();
            } else {
                updatePlayIcon(false);
            }

            state.wasPlaying = false;
        };

        seekEl.addEventListener("pointerup", endSeek);
        seekEl.addEventListener("pointercancel", endSeek);

        seekEl.addEventListener("keydown", (event) => {
            const duration = audio.duration;

            if (!Number.isFinite(duration) || duration <= 0) return;

            let time = audio.currentTime;

            if (event.key === "ArrowLeft") {
                time -= 5;
            } else if (event.key === "ArrowRight") {
                time += 5;
            } else if (event.key === "Home") {
                time = 0;
            } else if (event.key === "End") {
                time = duration;
            } else {
                return;
            }

            event.preventDefault();

            audio.currentTime = clamp(time, 0, duration);
            savePosition();
            updateUI();
        });

        playBtn.addEventListener("click", togglePlay);
        prevBtn.addEventListener("click", () => step(-1));
        nextBtn.addEventListener("click", () => step(1));

        audio.addEventListener("play", () => {
            updatePlayIcon(true);
            hintEl.textContent = "";
            startTicker();
        });

        audio.addEventListener("pause", () => {
            if (!state.seeking) {
                updatePlayIcon(false);
                savePosition();
            }
        });

        audio.addEventListener("timeupdate", () => {
            if (audio.paused && !state.seeking) {
                updateUI();
            }
        });

        audio.addEventListener("ended", () => {
            const track = state.tracks[state.index];

            if (track) {
                positions[track.src] = 0;

                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
                } catch {
                    /* 忽略存储失败 */
                }
            }

            updatePlayIcon(false);
            updateUI();
        });

        document.addEventListener("keydown", (event) => {
            if (event.code !== "Space") return;

            const target = event.target;

            if (target instanceof HTMLButtonElement || target === seekEl) return;

            event.preventDefault();
            togglePlay();
        });

        window.addEventListener("pagehide", savePosition);

        init();
    })();
</script>
</body>
</html>
