<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
    <defs>
        <!-- 极细的物理网格线 -->
        <pattern id="grid-lines" width="120" height="120" patternUnits="userSpaceOnUse">
            <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#000000" stroke-opacity="0.04" stroke-width="1" />
        </pattern>
    </defs>

    <!-- 背景底色 (暖白色/米色) -->
    <rect width="1920" height="1080" fill="#F7F5F0" />

    <!-- 铺满底层的物理网格 -->
    <rect width="1920" height="1080" fill="url(#grid-lines)" />

    <!-- 半透明的代码字符排版矩阵 (对比度已调高) -->
    <!-- 使用 #333333 加上 0.15 的透明度，在米色背景上呈现出清晰的浅灰褐色 -->
    <g font-family="'Consolas', 'Courier New', monospace" fill="#333333" fill-opacity="0.15" text-anchor="middle">
        <!-- 第一排 -->
        <text x="150" y="220" font-size="110">3647</text>
        <text x="600" y="220" font-size="110">0xFF</text>
        <text x="1000" y="220" font-size="110">&lt;/&gt;</text>
        <text x="1450" y="220" font-size="110">0.300000</text>

        <!-- 第二排 -->
        <text x="200" y="420" font-size="110">1010</text>
        <text x="700" y="420" font-size="110">e309</text>
        <text x="1150" y="420" font-size="110">NaN</text>
        <text x="1650" y="420" font-size="110">=&gt;</text>

        <!-- 第三排 -->
        <text x="100" y="620" font-size="110">74</text>
        <text x="500" y="620" font-size="110">&amp;&amp;</text>
        <text x="1150" y="620" font-size="110">0x7FFFFFFF</text>

        <!-- 第四排 -->
        <text x="300" y="800" font-size="110">!=</text>
        <text x="900" y="800" font-size="110">2147483647</text>
        <text x="1600" y="800" font-size="110">0.1+0.2</text>

        <!-- 第五排 -->
        <text x="150" y="1000" font-size="110">2^31-1</text>
        <text x="650" y="1000" font-size="110">* /</text>
        <text x="1050" y="1000" font-size="110">0x00</text>
        <text x="1500" y="1000" font-size="110">| &gt;</text>
    </g>
</svg>